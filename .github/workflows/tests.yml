name: MoonBit tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned MoonBit toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $homePath = Join-Path $env:RUNNER_TEMP 'moonbit'
          $cli = Join-Path $env:RUNNER_TEMP 'moonbit-cli.zip'
          $core = Join-Path $env:RUNNER_TEMP 'moonbit-core.zip'
          $version = '0.10.20%2B65efd5b93'
          Invoke-WebRequest "https://cli.moonbitlang.com/binaries/$version/moonbit-windows-x86_64.zip" -OutFile $cli
          Invoke-WebRequest "https://cli.moonbitlang.com/cores/core-$version.zip" -OutFile $core
          if ((Get-FileHash $cli).Hash -ne 'bdff9a3b2d7c61a3adae2fe09221d3de63effc6cab28bfa0cbeb94fb0d529d79') { throw 'MoonBit CLI SHA-256 mismatch' }
          if ((Get-FileHash $core).Hash -ne 'd7982eed233e0c4f933f566274cc9777466447e0d5b633006e8bf18975c7c833') { throw 'MoonBit core SHA-256 mismatch' }
          Expand-Archive -LiteralPath $cli -DestinationPath $homePath
          Expand-Archive -LiteralPath $core -DestinationPath (Join-Path $homePath 'lib')
          $env:MOON_HOME = $homePath
          $bin = Join-Path $homePath 'bin'
          $env:Path = "$bin;$env:Path"
          Push-Location (Join-Path $homePath 'lib/core')
          try {
            moon bundle --target js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          "MOON_HOME=$homePath" >> $env:GITHUB_ENV
          "$bin" >> $env:GITHUB_PATH
      - run: moon check --target js -d
      - run: moon test --target js
      - run: moon build --target js
      - run: node --test tests/integration.test.cjs
